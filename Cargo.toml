[package]
name = "sonoma-vision"
version = "0.2.0"
edition = "2024"
description = "Standalone AprilTag processor service for FRC SystemCore: V4L2 capture, napa-vision detection, NT4 publishing"
license = "(MIT OR Apache-2.0) AND GPL-3.0-only"
repository = "https://github.com/compenguy/sonoma-vision"
homepage = "https://github.com/compenguy/sonoma-vision"
readme = "README.md"
publish = false

[features]
default = ["mjpeg"]
# Decode MJPEG camera frames (a copy per frame; GREY, YUYV, UYVY and NV12 are read in place).
mjpeg = ["dep:zune-jpeg"]

[build-dependencies]
cc = "1"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "string"] }
env_logger = "0.11"
jpeg-encoder = "0.7"
libc = "0.2"
log = "0.4"
nt_client = { version = "0.5.1", features = ["publish_bypass", "struct", "math"] }
nalgebra = "0.34"
serde_json = "1"
toml = "1"
# NT values as nt_client hands them over.
rmpv = "1.3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
v4l2r = "0.0.8"
zune-jpeg = { version = "0.4", optional = true }

[dev-dependencies]
futures-util = "0.3"
serde_json = "1"
tokio-tungstenite = "0.28"

# nt_client with three small fixes (TCP_NODELAY, time-sync sign, timestamped publish); see
# vendor/nt_client/PATCHES.md. Drop this once they're released upstream.
[patch.crates-io]
nt_client = { path = "vendor/nt_client" }

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1

[profile.dev]
# The detector is unusably slow without optimisation; tests run it on many frames.
opt-level = 2
